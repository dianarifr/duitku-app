<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Duitku</title>
    <meta name="theme-color" content="#f6f3ec" id="theme-color-meta">
    <script>
      // Tema dipilih sebelum paint supaya tidak ada kedip.
      (function () {
        try {
          var saved = localStorage.getItem('duitku.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta && document.documentElement.dataset.theme === 'dark') {
            meta.setAttribute('content', '#14130f');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
